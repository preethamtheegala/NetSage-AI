! =======================================================
! NetSage AI Lab 12: Switchport Port Security & Err-Disable
! Devices: Switch SW1 (Cisco Catalyst 2960)
! =======================================================

hostname SW1-Security
interface FastEthernet0/12
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
 no shutdown

! --- TO REPRODUCE VIOLATION ---
! Connect a second PC or hub to port Fa0/12.
! Port transitions immediately to 'err-disabled'.
!
! --- TO DIAGNOSE ---
! SW1# show port-security interface Fa0/12
! SW1# show interfaces status err-disabled
!
! --- REMEDIATION COMMANDS ---
! 1. Disconnect unauthorized device
! 2. Reset interface:
! SW1(config)# interface FastEthernet0/12
! SW1(config-if)# shutdown
! SW1(config-if)# no shutdown

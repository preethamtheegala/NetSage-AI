! =======================================================
! NetSage AI Lab 03: DHCP Relay & DHCP Snooping
! Devices: Router R1 (DHCP Server), Router R2 (Relay), Switch SW1 (Snooping)
! =======================================================

! --- R1 (DHCP Server) CONFIGURATION ---
hostname R1-DHCPServer
ip dhcp pool VLAN10_POOL
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 8.8.8.8
!
interface GigabitEthernet0/0
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
ip route 192.168.10.0 255.255.255.0 10.0.0.2

! --- R2 (Default Gateway & Relay) CONFIGURATION ---
hostname R2-Relay
interface GigabitEthernet0/0
 ip address 10.0.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 ip address 192.168.10.1 255.255.255.0
 no shutdown
 ! INTENTIONAL FAULT: ip helper-address 10.0.0.1 is missing!
!

! --- SW1 (Access Switch) CONFIGURATION ---
hostname SW1-Access
ip dhcp snooping
ip dhcp snooping vlan 10
! INTENTIONAL FAULT: Uplink Gi0/1 is NOT trusted
interface GigabitEthernet0/1
 switchport mode trunk
!
interface FastEthernet0/1
 switchport mode access
 switchport access vlan 10

! --- REMEDIATION ---
! 1. Add relay on R2:
! R2(config)# interface GigabitEthernet0/1
! R2(config-if)# ip helper-address 10.0.0.1
!
! 2. Trust uplink on SW1:
! SW1(config)# interface GigabitEthernet0/1
! SW1(config-if)# ip dhcp snooping trust

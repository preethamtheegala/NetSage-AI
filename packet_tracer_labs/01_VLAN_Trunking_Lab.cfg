! =======================================================
! NetSage AI Lab 01: Inter-VLAN Routing & 802.1Q Trunking
! Device: Switch SW1 (Cisco Catalyst 2960) & Router R1 (Cisco 2911)
! =======================================================

! --- SW1 BASELINE CONFIGURATION ---
hostname SW1
vlan 10
 name STUDENT
vlan 20
 name FACULTY
vlan 30
 name SERVER
!
interface FastEthernet0/1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
!
interface FastEthernet0/24
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
!
interface GigabitEthernet0/1
 switchport mode trunk
 switchport trunk allowed vlan 1-29,31-4094   ! INTENTIONAL FAULT: VLAN 30 excluded
!

! --- R1 BASELINE CONFIGURATION ---
hostname R1
interface GigabitEthernet0/0
 no shutdown
!
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
! INTENTIONAL FAULT: Subinterface GigabitEthernet0/0.30 is missing on R1

! --- REMEDIATION / FIX COMMANDS ---
! 1. Fix Trunk on SW1:
! SW1(config)# interface GigabitEthernet0/1
! SW1(config-if)# switchport trunk allowed vlan add 30
!
! 2. Create subinterface on R1:
! R1(config)# interface GigabitEthernet0/0.30
! R1(config-subif)# encapsulation dot1Q 30
! R1(config-subif)# ip address 192.168.30.1 255.255.255.0

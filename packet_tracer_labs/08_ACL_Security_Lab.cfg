! =======================================================
! NetSage AI Lab 08: Standard & Extended Access Control Lists
! Devices: Router R1 (Gateway & Firewall)
! =======================================================

hostname R1-Gateway
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
! INTENTIONAL FAULT 1: ACL 10 on line vty blocks admin from 192.168.1.50
access-list 10 permit 172.16.0.0 0.0.255.255
access-list 10 deny any
!
line vty 0 4
 access-class 10 in
 transport input ssh
 login local
!
! INTENTIONAL FAULT 2: ACL 101 extended permits port 8080 instead of HTTP port 80
ip access-list extended 101
 permit icmp 192.168.1.0 0.0.0.255 10.0.0.0 0.0.0.255
 permit tcp 192.168.1.0 0.0.0.255 10.0.0.0 0.0.0.255 eq 8080
 deny ip any any
!
interface GigabitEthernet0/0
 ip access-group 101 in

! --- REMEDIATION ---
! R1(config)# ip access-list standard 10
! R1(config-std-nacl)# 15 permit 192.168.1.0 0.0.0.255
!
! R1(config)# ip access-list extended 101
! R1(config-ext-nacl)# 25 permit tcp 192.168.1.0 0.0.0.255 10.0.0.0 0.0.0.255 eq 80

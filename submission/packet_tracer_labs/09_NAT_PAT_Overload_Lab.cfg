! =======================================================
! NetSage AI Lab 09: NAT & PAT Overload Configuration
! Devices: Router R1 (NAT Gateway)
! =======================================================

hostname R1-NAT
interface GigabitEthernet0/0
 description WAN-Interface
 ip address 203.0.113.1 255.255.255.252
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description LAN-Interface
 ip address 192.168.1.1 255.255.255.0
 ip nat inside
 no shutdown
!
access-list 1 permit 192.168.1.0 0.0.0.255
!
! INTENTIONAL FAULT: Missing 'overload' keyword restricts NAT to 1 single concurrent host
ip nat inside source list 1 interface GigabitEthernet0/0

! --- REMEDIATION ---
! R1(config)# no ip nat inside source list 1 interface GigabitEthernet0/0
! R1(config)# ip nat inside source list 1 interface GigabitEthernet0/0 overload
! R1# clear ip nat translation *

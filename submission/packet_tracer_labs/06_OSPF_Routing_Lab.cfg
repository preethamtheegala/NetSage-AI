! =======================================================
! NetSage AI Lab 06: OSPF Area & MTU Troubleshooting
! Devices: Router R1 & Router R2
! =======================================================

! --- R1 CONFIGURATION ---
hostname R1
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 ip address 10.0.0.1 255.255.255.252
 ip mtu 1500
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 10.0.0.0 0.0.0.3 area 0
 network 1.1.1.1 0.0.0.0 area 0

! --- R2 CONFIGURATION ---
hostname R2
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
!
interface GigabitEthernet0/0
 ip address 10.0.0.2 255.255.255.252
 ip mtu 1400  ! INTENTIONAL FAULT 1: MTU mismatch causes EXSTART stuck
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 network 10.0.0.0 0.0.0.3 area 1  ! INTENTIONAL FAULT 2: Area ID mismatch (Area 1 vs Area 0)
 network 2.2.2.2 0.0.0.0 area 1

! --- REMEDIATION COMMANDS ---
! 1. Fix Area ID mismatch:
! R2(config)# router ospf 1
! R2(config-router)# no network 10.0.0.0 0.0.0.3 area 1
! R2(config-router)# network 10.0.0.0 0.0.0.3 area 0
!
! 2. Fix MTU mismatch:
! R2(config)# interface GigabitEthernet0/0
! R2(config-if)# ip mtu 1500
